[project]
name = "agente-ciar"
version = "2.0.0"
description = "Read-only LangGraph agent for the CIAR academic and employment graph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "langchain-core>=0.3.79",
    "langchain-neo4j>=0.5.0",
    "langchain-openai>=0.2.0",
    "langsmith>=0.3.45",
    "langgraph>=0.6.10",
    "neo4j>=5.28.0",
    "openpyxl>=3.1.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.2",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = ["mypy>=1.10.0", "pytest>=8.0.0", "ruff>=0.9.0", "types-openpyxl"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
agente = ["prompts/*.md", "utils/*.md"]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
mypy_path = "."
strict = true

[[tool.mypy.overrides]]
module = [
    "agente.nodos.ejecutar_plantilla",
    "agente.nodos.generar_cypher",
    "agente.nodos.planificador",
]
ignore_errors = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
